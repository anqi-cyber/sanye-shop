<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title">
  <title id="title">雪松晚风香薰蜡烛</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecdcc4"/>
      <stop offset="1" stop-color="#d1ab80"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d96f3f"/>
      <stop offset=".55" stop-color="#f4b85f"/>
      <stop offset="1" stop-color="#fff3c4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf6e9" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#efe3cf" stop-opacity=".65"/>
      <stop offset="1" stop-color="#d8c3a4" stop-opacity=".8"/>
    </linearGradient>
    <filter id="glow">
